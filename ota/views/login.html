<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Access Authorization - Mengdev IoT</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --accent: #6366f1;
            --text-main: #d1d5db;
            --text-muted: #6b7280;
            --border: #1f2937;
        }

        body {
            font-family: 'monospace';
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 13px;
        }

        .glass-panel {
            background: #111113;
            border: 1px solid var(--border);
            padding: 2rem;
            width: 100%;
            max-width: 380px;
        }

        .json-key {
            color: #818cf8;
        }

        .json-val-str {
            color: #34d399;
        }

        .json-val-num {
            color: #fbbf24;
        }

        input {
            background: #000;
            border: 1px solid var(--border);
            color: #34d399;
            padding: 10px;
            font-family: inherit;
            width: 100%;
            text-align: center;
            letter-spacing: 0.5em;
            font-size: 1.5rem;
            margin: 1rem 0;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-minimal {
            background: transparent;
            color: #818cf8;
            padding: 10px;
            font-size: 11px;
            width: 100%;
            font-weight: bold;
            border: 1px solid var(--border);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }

        .btn-minimal:hover:not(:disabled) {
            background: rgba(129, 140, 248, 0.05);
            border-color: var(--accent);
            color: #34d399;
        }

        .btn-minimal:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert-error {
            color: #f87171;
            font-size: 11px;
            margin-top: 10px;
            border: 1px solid #7f1d1d;
            padding: 8px;
            background: rgba(127, 29, 29, 0.1);
        }

        .alert-success {
            color: #34d399;
            font-size: 11px;
            margin-top: 10px;
            border: 1px solid #064e3b;
            padding: 8px;
            background: rgba(6, 78, 59, 0.1);
        }

        .terminal-header {
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="glass-panel">
        <div class="terminal-header">
            <span>[AUTH_REQUIRED]</span>
            <span class="animate-pulse">●</span>
        </div>

        <div class="space-y-1 mb-6 opacity-80">
            <div><span class="json-key">"status"</span>: <span class="json-val-str">"unauthorized"</span>,</div>
            <div><span class="json-key">"client"</span>: <span class="json-val-str">"web_browser"</span>,</div>
            <div><span class="json-key">"method"</span>: <span class="json-val-str">"telegram_otp"</span></div>
        </div>

        {{if .error}}
        <div class="alert-error">
            > ERR: {{.error}}
        </div>
        {{end}}

        <form action="/login" method="POST" class="mt-4">
            <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Input Auth Code:</div>
            <input type="text" name="code" id="code" required autofocus maxlength="6" autocomplete="off"
                placeholder="••••••">

            <button type="submit" class="btn-minimal mt-2">[ Execute Login ]</button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-800">
            <button id="requestCodeBtn" class="btn-minimal">
                <span id="btnText">[ Request OTP via Telegram ]</span>
            </button>
            <div id="ajax-msg"></div>
        </div>

        <div class="mt-4 text-[10px] text-gray-600 text-center uppercase tracking-tighter">
            Security Layer v2.0
        </div>
    </div>

    <script>
        document.getElementById('requestCodeBtn').addEventListener('click', function () {
            const btn = this;
            const btnText = document.getElementById('btnText');
            const originalText = btnText.textContent;
            const msgContainer = document.getElementById('ajax-msg');

            btn.disabled = true;
            btnText.textContent = '[ Transmission Pending... ]';
            msgContainer.innerHTML = '';

            fetch('/request-code', {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        msgContainer.innerHTML = `
                        <div class="alert-success">
                            > SUCCESS: OTP packet dispatched to Telegram.
                        </div>
                    `;
                    } else {
                        msgContainer.innerHTML = `
                        <div class="alert-error">
                            > FAIL: ${data.message || 'Transmission failed'}
                        </div>
                    `;
                    }
                })
                .catch(err => {
                    msgContainer.innerHTML = `
                    <div class="alert-error">
                        > ERR: Link failure to gateway.
                    </div>
                `;
                })
                .finally(() => {
                    btn.disabled = false;
                    btnText.textContent = originalText;
                });
        });

        // Auto-format input
        document.getElementById('code').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\s/g, '').toUpperCase();
            if (value.length > 6) value = value.slice(0, 6);
            e.target.value = value;
        });
    </script>
</body>

</html>
