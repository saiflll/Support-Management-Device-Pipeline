<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IoT OTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }
        @keyframes morph {
            0%, 100% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
                transform: translate(10px, -10px) rotate(90deg);
            }
            50% {
                border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%;
                transform: translate(-10px, 10px) rotate(180deg);
            }
            75% {
                border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;
                transform: translate(10px, 5px) rotate(270deg);
            }
        }
        body {
            background: #000;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(168, 85, 247, 0.05) 40%, transparent 70%);
            top: 10%;
            left: 10%;
            animation: float 20s ease-in-out infinite, morph 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }
        body::after {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, rgba(34, 211, 238, 0.05) 40%, transparent 70%);
            bottom: 15%;
            right: 15%;
            animation: float 25s ease-in-out infinite reverse, morph 18s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }
        .morph-blob-1 {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, rgba(239, 68, 68, 0.04) 40%, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: morph 20s ease-in-out infinite, float 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            filter: blur(50px);
        }
        .morph-blob-2 {
            position: fixed;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.12) 0%, rgba(249, 115, 22, 0.04) 40%, transparent 70%);
            bottom: 30%;
            left: 20%;
            animation: morph 22s ease-in-out infinite reverse, float 28s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
            filter: blur(50px);
        }
        .cyber-card {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 4px 30px rgba(168, 85, 247, 0.1);
            position: relative;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.2, 1);
        }
        .cyber-card:hover {
            border-color: rgba(168, 85, 247, 0.8);
            box-shadow: 0 8px 40px rgba(168, 85, 247, 0.25);
            transform: translateY(-3px);
        }
        .input-morph {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 211, 238, 0.3);
            transition: all 0.3s ease;
        }
        .input-morph:focus {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(34, 211, 238, 0.8);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
        }
        .btn-primary {
            background: rgba(34, 211, 238, 0.1);
            border: 2px solid rgba(34, 211, 238, 0.6);
            color: #22d3ee;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: rgba(34, 211, 238, 0.2);
            border-color: #22d3ee;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.5);
        }
        .btn-secondary {
            background: rgba(168, 85, 247, 0.1);
            border: 2px solid rgba(168, 85, 247, 0.6);
            color: #a855f7;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }
        .text-glow-purple {
            color: #a855f7;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }
        .text-glow-cyan {
            color: #22d3ee;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
        }
    </style>
</head>
<body class="text-gray-100 flex items-center justify-center min-h-screen font-sans p-4">
    
    <div class="morph-blob-1"></div>
    <div class="morph-blob-2"></div>

    <div class="cyber-card rounded-2xl p-8 w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 border-2 border-purple-500">
                <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-glow-purple mb-2">IoT OTA Access</h1>
            <p class="text-gray-400 text-sm">Masukkan kode verifikasi dari Telegram</p>
        </div>

        <div id="message-container" class="mb-6"></div>

        {{if .error}}
        <div id="error-msg" class="bg-red-500/10 border border-red-500/40 text-red-400 text-sm p-3 rounded-xl mb-6 text-center backdrop-blur-sm">
            {{.error}}
        </div>
        {{end}}

        {{if .success}}
        <div id="success-msg" class="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-sm p-3 rounded-xl mb-6 text-center backdrop-blur-sm">
            {{.success}}
        </div>
        {{end}}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label for="code" class="block text-sm font-medium text-cyan-400 mb-2">Kode Verifikasi</label>
                <input type="text" name="code" id="code" required autofocus maxlength="6"
                       class="input-morph w-full rounded-xl p-4 text-center text-2xl tracking-[0.5em] outline-none transition-all duration-300 text-white font-mono"
                       placeholder="• • • • • •">
            </div>
            <button type="submit"
                    class="btn-primary w-full px-6 py-4 rounded-xl font-bold transition-all duration-300 transform active:scale-95">
                <span class="flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                    Login
                </span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-700/30">
            <button id="requestCodeBtn"
                    class="btn-secondary w-full px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 transform active:scale-95">
                <span class="flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                    </svg>
                    <span id="btnText">Kirim Kode ke Telegram</span>
                </span>
            </button>
        </div>
    </div>

    <script>
        document.getElementById('requestCodeBtn').addEventListener('click', function() {
            const btn = this;
            const btnText = document.getElementById('btnText');
            const originalText = btnText.textContent;
            const msgContainer = document.getElementById('message-container');
            
            btn.disabled = true;
            btnText.textContent = 'Mengirim...';
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            msgContainer.innerHTML = '';

            fetch('/request-code', { 
                method: 'POST',
                credentials: 'same-origin'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        msgContainer.innerHTML = `
                            <div class="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-sm p-3 rounded-xl text-center backdrop-blur-sm">
                                <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                Kode verifikasi telah dikirim ke Telegram!
                            </div>
                        `;
                    } else {
                        msgContainer.innerHTML = `
                            <div class="bg-red-500/10 border border-red-500/40 text-red-400 text-sm p-3 rounded-xl text-center backdrop-blur-sm">
                                <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                                ${data.message || 'Gagal mengirim kode'}
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    console.error('Error requesting code:', err);
                    msgContainer.innerHTML = `
                        <div class="bg-red-500/10 border border-red-500/40 text-red-400 text-sm p-3 rounded-xl text-center backdrop-blur-sm">
                            <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Gagal menghubungi server
                        </div>
                    `;
                })
                .finally(() => {
                    btn.disabled = false;
                    btnText.textContent = originalText;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                });
        });

        // Auto-format input
        document.getElementById('code').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            if (value.length > 6) value = value.slice(0, 6);
            e.target.value = value;
        });
    </script>
</body>
</html>
