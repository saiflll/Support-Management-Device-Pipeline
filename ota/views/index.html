<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Ment IoT</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --accent: #6366f1;
            --text-main: #d1d5db;
            --text-muted: #6b7280;
            --border: #1f2937;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #374151 #0a0a0c;
        }

        body {
            font-family: 'monospace';
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            font-size: 13px;
        }

        .glass-panel {
            background: #111113;
            border: 1px solid var(--border);
        }

        .main-tab {
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .main-tab.active {
            color: #34d399;
        }

        .tab-button {
            transition: all 0.2s;
            position: relative;
            opacity: 0.6;
        }

        .tab-button.active {
            color: #34d399;
            opacity: 1;
        }

        .node-card {
            background: #111113;
            border: 1px solid var(--border);
            padding: 0.75rem;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .json-key {
            color: #818cf8;
        }

        .json-val-str {
            color: #34d399;
        }

        .json-val-num {
            color: #fbbf24;
        }

        .json-val-bool {
            color: #f87171;
        }

        .btn-minimal {
            background: transparent;
            color: #818cf8;
            padding: 4px 2px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'monospace';
        }

        .btn-minimal:hover {
            color: #34d399;
            background: rgba(129, 140, 248, 0.1);
            border-radius: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(2px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(2px);
        }

        input {
            background: #000;
            border: 1px solid var(--border);
            color: #34d399;
            padding: 6px;
            font-family: inherit;
        }
    </style>
</head>

<body class="selection:bg-indigo-100 antialiased">
    <div class="max-w-6xl mx-auto px-4 py-4">
        <!-- Header Minimalis Terminal -->
        <header class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
            <div class="flex items-center gap-6">
                <span class="text-accent font-bold">[MENT_IoT]</span>
                <nav class="flex gap-4 text-xs">
                    <button data-target="ota" class="main-tab active pb-1 font-bold">[ /OTA ]</button>
                    <button data-target="forwarder" class="main-tab text-gray-500 hover:text-gray-300 pb-1">[ /PIPELINE
                        ]</button>
                </nav>
            </div>
            <div class="flex items-center gap-4 text-[10px]">
                <span id="live-indicator" class="text-emerald-500 animate-pulse">● LIVE_STREAM</span>
                <form action="/logout" method="POST">
                    <button type="submit"
                        class="text-gray-600 hover:text-red-500 hover:underline transition-all font-bold tracking-widest">[EXIT]</button>
                </form>
            </div>
        </header>

        <!-- Content Body -->
        <main id="content-ota" class="main-content animate-fade-in">
            <div class="flex flex-col gap-6">
                <!-- Assets & Filters Row -->
                <div class="flex items-center justify-between gap-4 py-2">
                    <div class="flex items-center gap-8">
                        <nav id="nodeTabs" class="flex gap-6 text-xs">
                            <button id="tab-running" data-target="runningNodes" class="tab-button active font-bold">
                                [ RUNNING: <span id="count-running">0</span> ]
                            </button>
                            <button id="tab-offline" data-target="offlineNodes"
                                class="tab-button text-gray-500 font-bold">
                                [ OFFLINE: <span id="count-offline">0</span> ]
                            </button>
                        </nav>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="triggerUpload" class="btn-minimal">
                            [+ FW]
                        </button>
                    </div>
                </div>

                <!-- Hidden Upload Form -->
                <div id="uploadFormContainer" class="hidden border-b border-gray-800 pb-6 animate-fade-in">
                    <form id="uploadForm" class="flex items-center gap-4">
                        <input id="fileInput" type="file" class="hidden" />
                        <label for="fileInput" class="btn-minimal cursor-pointer">
                            [CHOOSE_FILE: <span id="fileNameLabel">NONE</span> ]
                        </label>
                        <button type="submit" class="btn-minimal text-accent">[UPLOAD_ASSETS :3]</button>
                        <span id="uploadMsg" class="text-[10px] uppercase font-bold text-accent"></span>
                    </form>
                    <div id="fileList" class="mt-4 flex flex-wrap gap-2">
                        <!-- Files via JS -->
                    </div>
                </div>

                <!-- Main Monitoring Grid -->
                <div id="runningNodes"
                    class="tab-content grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Nodes via JS -->
                </div>
                <div id="offlineNodes"
                    class="tab-content hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Nodes via JS -->
                </div>
            </div>
        </main>

        <!-- Forwarder Body -->
        <main id="content-forwarder" class="main-content hidden animate-fade-in">
            <div class="flex flex-col gap-6">
                <!-- Status Bar Row -->
                <div class="flex items-center justify-between gap-4 py-2 border-b border-gray-800 pb-4">
                    <div class="flex gap-8 text-[10px] font-bold">
                        <div class="flex flex-col gap-1">
                            <span class="text-gray-500">CLOUD_STATUS:</span>
                            <span id="last-forward-status" class="text-accent">[STANDBY]</span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span class="text-gray-500">CACHE_QUEUE:</span>
                            <span id="buffer-items" class="text-emerald-500">0</span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span class="text-gray-500">NEXT_SYNC:</span>
                            <span id="countdown" class="text-yellow-500">00:00</span>
                        </div>
                    </div>
                </div>

                <!-- Tools Row (Filter & Export) -->
                <div class="flex items-center justify-between gap-4 border-b border-gray-800/50 pb-4">
                     <div class="flex gap-2 w-full max-w-md">
                        <input type="text" id="forwardFilter" placeholder="[FILTER_STREAM_BY_CK_OR_AREA]" 
                               class="bg-black border border-gray-800 text-emerald-500 text-[10px] p-2 flex-1 focus:border-emerald-500 outline-none font-mono placeholder-gray-700">
                     </div>
                     <div class="flex gap-2">
                        <button id="btn-refresh-fwd" class="btn-minimal text-accent border border-indigo-900/30 px-3 py-1.5 hover:bg-indigo-900/20">[FORCE_FETCH]</button>
                        <button id="btn-export-csv" class="btn-minimal text-emerald-500 border border-emerald-900/30 px-3 py-1.5 hover:bg-emerald-900/20">[EXPORT_EXT_DATA_CSV]</button>
                     </div>
                </div>

                <!-- Telemetry Stream -->
                <div class="space-y-3">
                    <div class="text-[10px] text-gray-600 font-bold mb-2">TELEMETRY_PIPELINE_STREAM:</div>
                    <div id="data-buffer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-auto">
                        <div class="col-span-full py-20 text-center text-gray-700 italic opacity-50">
                            [AWAITING_DATA_PACKETS]</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Simple Modals -->
    <div id="logModal" class="modal-overlay fixed inset-0 hidden items-center justify-center z-50 p-6">
        <div class="modal-content glass-panel w-full max-w-2xl bg-black border-gray-700">
            <div class="p-3 border-b border-gray-800 flex justify-between items-center">
                <span class="text-accent font-bold">[LOG_OUTPUT]</span>
                <button data-action="close-modal" class="text-gray-500 hover:text-white">[X]</button>
            </div>
            <div id="modalBody"
                class="p-4 font-mono text-[10px] leading-tight max-h-[500px] overflow-auto text-emerald-500"></div>
        </div>
    </div>

    <div id="configModal" class="modal-overlay fixed inset-0 hidden items-center justify-center z-50 p-6">
        <div class="modal-content glass-panel w-full max-w-md p-6 bg-black border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <span class="text-accent font-bold">[RUNTIME_CONFIG]</span>
                <button data-action="close-config-modal" class="text-gray-500 hover:text-white">[X]</button>
            </div>
            <div class="space-y-4">
                <!-- Modal Content (Scrollable) -->
                <div class="px-6 py-4 max-h-[70vh] overflow-y-auto custom-scrollbar">
                    <div id="dynamicConfigFields" class="grid grid-cols-2 items-center gap-4">
                        <!-- Fields injected by JS -->
                    </div>
                </div>
                <button data-action="send-config"
                    class="btn-minimal w-full text-accent font-bold tracking-widest">[COMMIT_CHANGES]</button>
            </div>
        </div>
    </div>
    </div>

    <div id="otaModal" class="modal-overlay fixed inset-0 hidden items-center justify-center z-50 p-6">
        <div class="modal-content glass-panel w-full max-w-sm p-6 bg-black border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <span class="text-accent font-bold">[DEPLOY_FLASH]</span>
                <button data-action="close-ota-modal" class="text-gray-500 hover:text-white">[X]</button>
            </div>
            <div class="space-y-4">
                <input type="text" id="otaUrlInput" class="w-full text-[10px]" placeholder="BOOT_URL">
                <button data-action="send-ota"
                    class="btn-minimal w-full text-accent font-bold tracking-widest">[EXECUTE_OTA]</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // UI Interaction Script
        document.querySelectorAll('.main-tab').forEach(tab => {
            tab.addEventListener('click', function () {
                const target = this.dataset.target;
                document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active', 'font-bold'));
                this.classList.add('active', 'font-bold');

                document.querySelectorAll('.main-content').forEach(c => c.classList.add('hidden'));
                document.getElementById('content-' + target).classList.remove('hidden');

                if (target === 'forwarder') {
                    updateForwarder();
                    window.fwdInterval = setInterval(updateForwarder, 3000);
                } else {
                    if (window.fwdInterval) clearInterval(window.fwdInterval);
                    if (window.fetchNodes) window.fetchNodes();
                    if (window.fetchFiles) window.fetchFiles();
                }
            });
        });

        document.querySelectorAll('.tab-button').forEach(tab => {
            tab.addEventListener('click', function () {
                const target = this.dataset.target;
                document.querySelectorAll('.tab-button').forEach(t => {
                    t.classList.remove('active', 'text-white');
                    t.classList.add('text-gray-500');
                });
                this.classList.add('active', 'text-white');
                this.classList.remove('text-gray-500');

                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(target).classList.remove('hidden');
            });
        });

        // Local Upload UX
        const fileInput = document.getElementById('fileInput');
        const fileNameLabel = document.getElementById('fileNameLabel');
        fileInput.addEventListener('change', (e) => {
            fileNameLabel.textContent = e.target.files.length > 0 ? e.target.files[0].name : "NONE";
        });

        document.getElementById('triggerUpload').addEventListener('click', () => {
            document.getElementById('uploadFormContainer').classList.toggle('hidden');
        });

        function updateForwarder() {
            fetch('/forwarder/status').then(r => r.json()).then(data => {
                document.getElementById('last-forward-status').textContent = `[${data.LastForwardStatus || 'STANDBY'}]`;
                document.getElementById('buffer-items').textContent = data.BufferItemCount || 0;

                const next = new Date(data.NextForwardTime);
                const seconds = Math.max(0, Math.floor((next - new Date()) / 1000));
                document.getElementById('countdown').textContent = `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;

                const buffer = document.getElementById('data-buffer');
                if (data.ReceivedDataBuffer?.length) {
                    buffer.innerHTML = data.ReceivedDataBuffer.reverse().slice(0, 12).map(item => `
                        <div class="node-card animate-fade-in font-mono text-[10px] leading-tight">
                            <div class="flex justify-between mb-1 border-b border-gray-800 pb-1">
                                <span class="text-accent font-bold">#PACKET_RECV</span>
                                <span class="text-emerald-500">OK</span>
                            </div>
                            <div>{ <span class="json-key">"area"</span>: <span class="json-val-num">${item.area}</span>, </div>
                            <div class="pl-2"> <span class="json-key">"ck"</span>: <span class="json-val-num">${item.ck}</span>, </div>
                            <div class="pl-2"> <span class="json-key">"temp"</span>: [${item.temp?.length || 0} pts], </div>
                            <div class="pl-2"> <span class="json-key">"door"</span>: [${item.door?.length || 0} pts] }</div>
                        </div>
                    `).join('');
                } else {
                    buffer.innerHTML = '<div class="col-span-full py-20 text-center text-gray-700 italic opacity-50">[BUFFER_EMPTY]</div>';
                }
            }).catch(() => { });
        }
    </script>
</body>

</html>
