<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>IoT Management Dashboard</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://cdn.tailwindcss.com"></script><style>@keyframes float{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(30px,-50px) rotate(120deg)}66%{transform:translate(-20px,20px) rotate(240deg)}}@keyframes morph{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%;transform:translate(0,0) rotate(0deg)}25%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%;transform:translate(10px,-10px) rotate(90deg)}50%{border-radius:50% 60% 30% 60%/30% 60% 70% 40%;transform:translate(-10px,10px) rotate(180deg)}75%{border-radius:60% 40% 60% 40%/40% 60% 40% 60%;transform:translate(10px,5px) rotate(270deg)}}body{background:#000;position:relative;overflow-x:hidden}body::before{content:'';position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(168,85,247,0.15)0%,rgba(168,85,247,0.05)40%,transparent 70%);top:10%;left:10%;animation:float 20s ease-in-out infinite,morph 15s ease-in-out infinite;pointer-events:none;z-index:0;filter:blur(60px)}body::after{content:'';position:fixed;width:350px;height:350px;background:radial-gradient(circle,rgba(34,211,238,0.15)0%,rgba(34,211,238,0.05)40%,transparent 70%);bottom:15%;right:15%;animation:float 25s ease-in-out infinite reverse,morph 18s ease-in-out infinite reverse;pointer-events:none;z-index:0;filter:blur(60px)}.morph-blob-1{position:fixed;width:300px;height:300px;background:radial-gradient(circle,rgba(239,68,68,0.12)0%,rgba(239,68,68,0.04)40%,transparent 70%);top:40%;left:50%;transform:translate(-50%,-50%);animation:morph 20s ease-in-out infinite,float 30s ease-in-out infinite;pointer-events:none;z-index:0;filter:blur(50px)}.morph-blob-2{position:fixed;width:280px;height:280px;background:radial-gradient(circle,rgba(249,115,22,0.12)0%,rgba(249,115,22,0.04)40%,transparent 70%);bottom:30%;left:20%;animation:morph 22s ease-in-out infinite reverse,float 28s ease-in-out infinite reverse;pointer-events:none;z-index:0;filter:blur(50px)}.cyber-card{background:rgba(0,0,0,.8);backdrop-filter:blur(15px) saturate(180%);position:relative;z-index:1;transition:all .4s cubic-bezier(.2,.9,.2,1)}.card-purple{border:1px solid rgba(168,85,247,.4);box-shadow:0 4px 30px rgba(168,85,247,.1)}.card-purple:hover{border-color:rgba(168,85,247,.8);box-shadow:0 8px 40px rgba(168,85,247,.25);transform:translateY(-3px)}.card-cyan{border:1px solid rgba(34,211,238,.4);box-shadow:0 4px 30px rgba(34,211,238,.1)}.card-cyan:hover{border-color:rgba(34,211,238,.8);box-shadow:0 8px 40px rgba(34,211,238,.25);transform:translateY(-3px)}.card-red{border:1px solid rgba(239,68,68,.4);box-shadow:0 4px 30px rgba(239,68,68,.1)}.card-red:hover{border-color:rgba(239,68,68,.8);box-shadow:0 8px 40px rgba(239,68,68,.25);transform:translateY(-3px)}.card-orange{border:1px solid rgba(249,115,22,.4);box-shadow:0 4px 30px rgba(249,115,22,.1)}.card-orange:hover{border-color:rgba(249,115,22,.8);box-shadow:0 8px 40px rgba(249,115,22,.25);transform:translateY(-3px)}.text-glow-purple{color:#a855f7;text-shadow:0 0 15px rgba(168,85,247,.6)}.text-glow-cyan{color:#22d3ee;text-shadow:0 0 15px rgba(34,211,238,.6)}.tab-active-purple{background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(168,85,247,.15));border-color:#a855f7;color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.4),inset 0 0 15px rgba(168,85,247,.1);transform:translateY(-2px) scale(1.02)}.tab-anim{transition:all .35s cubic-bezier(.2,.9,.2,1)}.scrollbar-custom::-webkit-scrollbar{width:6px}.scrollbar-custom::-webkit-scrollbar-track{background:#0a0a0a}.scrollbar-custom::-webkit-scrollbar-thumb{background:linear-gradient(to bottom,#a855f7,#22d3ee);border-radius:3px}button:focus{outline:none;box-shadow:none}button,input,.cyber-card{transition:all .4s cubic-bezier(.2,.9,.2,1)}input:focus,button:hover{transform:scale(1.01)}</style></head><body class="text-gray-100 min-h-screen font-sans"><div class="morph-blob-1"></div><div class="morph-blob-2"></div><div class="max-w-7xl mx-auto p-4 sm:p-6 relative z-10"><header class="cyber-card card-purple rounded-2xl p-6 mb-6 transition-all duration-300"><div class="flex items-center justify-between mb-6"><div class="flex items-center space-x-4"><div class="p-3 rounded-xl border border-purple-500"><svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg></div><div><h1 class="text-2xl font-bold text-glow-purple">IoT Management Dashboard</h1><p class="text-xs text-gray-400 mt-0.5">Unified Control Panel • <span class="text-gray-500 text-[10px]">{{.serverName}}</span></p></div></div><form action="/logout" method="POST"><button type="submit" class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-black px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300">Logout</button></form></div><nav class="flex space-x-2"><button data-target="ota" id="main-tab-ota" class="main-tab tab-anim flex-1 py-3 px-6 rounded-xl font-semibold text-sm border border-gray-700 tab-active-purple">OTA & Nodes</button><button data-target="forwarder" id="main-tab-forwarder" class="main-tab tab-anim flex-1 py-3 px-6 rounded-xl font-semibold text-sm border border-gray-700 text-gray-400">Forwarder</button></nav></header><div id="content-ota" class="main-content"><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-1 space-y-6"><div class="cyber-card card-cyan rounded-2xl p-6 transition-all duration-300"><h2 class="text-lg font-semibold mb-4 text-glow-cyan">Upload OTA</h2><form id="uploadForm" class="space-y-4"><input id="fileInput" type="file" class="block w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border file:border-cyan-400 file:text-sm file:font-semibold file:bg-transparent file:text-cyan-400 hover:file:bg-cyan-400 hover:file:text-black file:transition-all file:cursor-pointer"/><button type="submit" class="w-full border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black px-6 py-3 rounded-xl font-bold transition-all duration-300">Upload Firmware</button></form><p id="uploadMsg" class="mt-3 text-sm text-lime-400 min-h-[20px]"></p></div><div class="cyber-card card-red rounded-2xl p-6 transition-all duration-300"><h3 class="font-semibold mb-4 text-red-400">OTA Files</h3><div id="fileList" class="space-y-2 max-h-80 overflow-auto scrollbar-custom"><p class="text-center text-gray-500 text-sm py-8">Belum ada file.</p></div></div></div><div class="lg:col-span-2"><div class="cyber-card card-orange rounded-2xl p-6 mb-6 transition-all duration-300"><div class="flex justify-between items-center"><h3 class="text-lg font-semibold text-orange-400">Nodes Monitor</h3><span class="text-xs font-mono bg-black/50 px-3 py-1.5 rounded-lg border border-orange-400/30 text-orange-400">● Auto-refresh: 5s</span></div></div><div class="cyber-card rounded-t-2xl border-b border-[#00d9ff]/30 mb-1"><nav class="flex space-x-1 p-2"><button id="tab-running" data-target="runningNodes" class="tab-button tab-anim flex-1 py-3 px-4 rounded-xl font-medium text-sm bg-[#00ff88]/20 text-[#00ff88] border border-[#00ff88]/30">Running <span id="count-running" class="ml-2 px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#00ff88]/30">0</span></button><button id="tab-offline" data-target="offlineNodes" class="tab-button tab-anim flex-1 py-3 px-4 rounded-xl font-medium text-sm text-gray-400 hover:text-[#00d9ff] border border-gray-700">Offline <span id="count-offline" class="ml-2 px-2.5 py-0.5 rounded-full text-xs font-bold bg-gray-700">0</span></button></nav></div><div id="runningNodes" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-4"></div><div id="offlineNodes" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div></div></div></div><div id="content-forwarder" class="main-content hidden"><div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"><div class="cyber-card rounded-2xl p-6 text-center"><h2 class="text-lg font-semibold text-gray-400 mb-2">Status Forward</h2><p id="last-forward-status" class="text-3xl font-bold mt-2 text-[#00d9ff]">-</p></div><div class="cyber-card rounded-2xl p-6 text-center"><h2 class="text-lg font-semibold text-gray-400 mb-2">Countdown</h2><p id="countdown" class="text-3xl font-bold mt-2 font-mono text-[#00d9ff]">00:00</p></div><div class="cyber-card rounded-2xl p-6 text-center"><h2 class="text-lg font-semibold text-gray-400 mb-2">Buffer Items</h2><p id="buffer-items" class="text-3xl font-bold mt-2 text-[#00d9ff]">0</p></div></div><div class="cyber-card rounded-2xl p-6"><h2 class="text-xl font-bold mb-4 text-[#00d9ff]">Data di Buffer</h2><div id="data-buffer" class="bg-black/60 rounded-xl p-4 h-96 overflow-y-auto scrollbar-custom font-mono text-sm border border-[#00d9ff]/20"><p class="text-gray-500">Menunggu data...</p></div></div></div></div>    </div>
  </div>

  <!-- Logs Modal -->
  <div id="logModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4">
    <div class="cyber-card card-cyan rounded-2xl w-full max-w-3xl p-6">
      <div class="flex justify-between items-center mb-5">
        <div class="font-semibold text-xl text-glow-cyan">
          Logs - <span id="modalNode"></span>
        </div>
        <button data-action="close-modal" class="text-gray-400 hover:text-cyan-400 transition-all duration-300 p-2">
          ✕
        </button>
      </div>
      <div id="modalBody" class="bg-black/60 p-4 rounded-xl text-sm text-gray-200 min-h-[150px] font-mono whitespace-pre-wrap scrollbar-custom max-h-96 overflow-auto border border-cyan-400/20"></div>
      <div class="mt-5 flex justify-end">
        <button data-action="close-modal" class="px-5 py-2.5 border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black rounded-xl text-sm font-semibold transition-all duration-300">
          Tutup
        </button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let forwarderInterval = null;
    
    // Main Tab Switching (OTA vs Forwarder)
    document.querySelectorAll('.main-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        const target = this.getAttribute('data-target');
        
        // Remove active class from all main tabs
        document.querySelectorAll('.main-tab').forEach(t => {
          t.classList.remove('tab-active-purple');
          t.classList.add('text-gray-400');
        });
        
        // Add active class to clicked tab
        this.classList.add('tab-active-purple');
        this.classList.remove('text-gray-400');
        
        // Hide all main content
        document.querySelectorAll('.main-content').forEach(content => {
          content.classList.add('hidden');
        });
        
        // Show selected content
        document.getElementById('content-' + target).classList.remove('hidden');
        
        // Start/stop forwarder interval
        if (target === 'forwarder') {
          updateForwarderStatus();
          forwarderInterval = setInterval(updateForwarderStatus, 2000);
        } else {
          if (forwarderInterval) {
            clearInterval(forwarderInterval);
            forwarderInterval = null;
          }
        }
      });
    });

    // Sub Tab Switching (Running vs Offline Nodes)
    document.querySelectorAll('.tab-button').forEach(tab => {
      tab.addEventListener('click', function() {
        const target = this.getAttribute('data-target');
        
        // Remove active from all sub tabs
        document.querySelectorAll('.tab-button').forEach(t => {
          t.classList.remove('bg-[#00ff88]/20', 'text-[#00ff88]', 'border-[#00ff88]/30');
          t.classList.add('text-gray-400', 'hover:text-[#00d9ff]', 'border-gray-700');
        });
        
        // Add active to clicked tab
        this.classList.add('bg-[#00ff88]/20', 'text-[#00ff88]', 'border-[#00ff88]/30');
        this.classList.remove('text-gray-400', 'hover:text-[#00d9ff]', 'border-gray-700');
        
        // Hide all tab content
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.add('hidden');
        });
        
        // Show selected content
        document.getElementById(target).classList.remove('hidden');
      });
    });

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateForwarderStatus() {
      fetch('/forwarder/status')
        .then(response => response.json())
        .then(data => {
          const statusEl = document.getElementById('last-forward-status');
          statusEl.textContent = data.LastForwardStatus || 'Belum ada';
          statusEl.className = 'text-3xl font-bold mt-2 ';
          if (data.LastForwardStatus === 'Sukses') {
            statusEl.classList.add('text-glow-cyan');
          } else if (data.LastForwardStatus === 'Gagal') {
            statusEl.classList.add('text-red-400');
          } else {
            statusEl.classList.add('text-glow-purple');
          }

          const countdownEl = document.getElementById('countdown');
          const nextForwardTime = new Date(data.NextForwardTime);
          const now = new Date();
          const diffSeconds = (nextForwardTime - now) / 1000;
          countdownEl.textContent = formatTime(diffSeconds);

          document.getElementById('buffer-items').textContent = data.BufferItemCount || 0;

          const dataBufferEl = document.getElementById('data-buffer');
          if (data.ReceivedDataBuffer && data.ReceivedDataBuffer.length > 0) {
            dataBufferEl.innerHTML = '';
            data.ReceivedDataBuffer.forEach(item => {
              const p = document.createElement('p');
              p.className = 'text-gray-300 mb-1';
              p.textContent = `[Area: ${item.area}, CK: ${item.ck}] Temp: ${item.temp?.length || 0}, Door: ${item.door?.length || 0}`;
              dataBufferEl.appendChild(p);
            });
          } else {
            dataBufferEl.innerHTML = '<p class="text-gray-500">Buffer kosong.</p>';
          }
        })
        .catch(err => {
          console.error("Error:", err);
          document.getElementById('data-buffer').innerHTML = '<p class="text-red-400">Gagal memuat status.</p>';
        });
    }
  </script>
</body>
</html>
