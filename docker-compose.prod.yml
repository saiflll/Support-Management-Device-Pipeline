services:
  # === Database Service ===
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === MQTT Broker ===
  emqx:
    image: emqx:5.5
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=${MQTT_USERNAME}
      - EMQX_AUTH__USER__1__PASSWORD=${MQTT_PASSWORD}
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Backend Forwarder Service ===
  backend:
    image: rennnagge/forwarder-app:latest
    container_name: forwarder
    ports:
      - "8888:8000"
    environment:
      - DB_HOST=postgres_db
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_BROKER_PUB=${MQTT_BROKER_PUB}
      - MQTT_TOPIC_PUB=${MQTT_TOPIC_PUB}
      - MQTT_USERNAME_FOR=${MQTT_USERNAME_FOR}
      - MQTT_PASSWORD_FOR=${MQTT_PASSWORD_FOR}
      - TELE_BOT_ALRT=${TELE_BOT_ALRT}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Asia/Jakarta
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net
      
  # === OTA Update Service ===
  ota:
    image: rennnagge/ota-app:latest
    container_name: ota-app
    ports:
      - "9999:9999"
    volumes:
      - ./ota/static/uploads:/app/static/uploads
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - TELE_BOT_OTA=${TELE_BOT_OTA}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Forming/Production Monitoring Service ===
  forming:
    image: rennnagge/forming-app:latest
    container_name: forming-app
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      - DB_HOST=postgres_db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # MQTT Configuration
      - MQTT_HOST=emqx
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # Google Sheets
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-}
      # Application Configuration
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net


volumes:
  postgres_data:
  emqx_data:
  emqx_log:

networks:
  iot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
