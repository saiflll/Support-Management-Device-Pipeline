services:
  # === Database Service ===
  postgres:
    image: rennnagge/postgres-db:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === MQTT Broker ===
  emqx:
    image: emqx:5.5
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=${MQTT_USERNAME}
      - EMQX_AUTH__USER__1__PASSWORD=${MQTT_PASSWORD}
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Redis Cache & Pub/Sub ===
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Forwarder Service (CSV→JSON, DB, Alert, Deadband) ===
  forwarder:
    build:
      context: ./core/forward
      dockerfile: Dockerfile
    image: rennn/forwarder-app:latest
    container_name: forwarder
    environment:
      - DB_HOST=postgres_db
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - TELE_BOT_ALRT=${TELE_BOT_ALRT}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Asia/Jakarta
      - REDIS_URL=redis://redis:6379/0
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    env_file:
      - .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/root:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Binary Bridge (HW binary → JSON) ===
  bridge:
    build:
      context: ./core/bridge
      dockerfile: Dockerfile
    image: rennn/bridge-app:latest
    container_name: bridge
    environment:
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === OTA Server (Firmware Management) ===
  ota:
    build:
      context: .
      dockerfile: core/ota/Dockerfile
    image: rennnagge/ota-app:latest
    container_name: ota-app
    ports:
      - "9999:9999"
    volumes:
      - ota_uploads:/app/static/uploads
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - TELE_BOT_OTA=${TELE_BOT_OTA}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SERVER_NAME=${SERVER_NAME:-ren_itdt_west}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - FORWARDER_URL=http://forwarder:8888/health
      - MONITOR_URL=http://forwarder:8888/monitor/status
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Production Monitoring Service ===
  production:
    build:
      context: .
      dockerfile: core/production/Dockerfile
    image: iot-production:latest
    container_name: production
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MQTT_HOST=emqx
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Dev Console (ttyd) ===
  console:
    build:
      context: ./core/sandbox
      dockerfile: Dockerfile
    container_name: dev-console
    ports:
      - "9998:9998"
    volumes:
      - sandbox_home:/home/dev
    environment:
      - DEV_PASS=${DEV_PASS:-devpass}
    restart: unless-stopped
    networks:
      - iot-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cf-tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    network_mode: "service:console"
    restart: unless-stopped

  # === AI Gateway ===
  router:
    image: decolua/9router:latest
    container_name: ai-router
    ports:
      - "9997:20128"
    volumes:
      - router_data:/data
    restart: unless-stopped
    networks:
      - iot-net

volumes:
  emqx_data:
  emqx_log:
  ota_uploads:
  redis_data:
  sandbox_home:
  router_data:

networks:
  iot-net:
    driver: bridge
