services:
  # === Database Service ===
  postgres:
    image: rennnagge/postgres-db:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === MQTT Broker ===
  emqx:
    image: emqx:5.5
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=${MQTT_USERNAME}
      - EMQX_AUTH__USER__1__PASSWORD=${MQTT_PASSWORD}
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === IoT Support: Forwarder + OTA Server (satu container) ===
  iot-support:
    build:
      context: .
      dockerfile: core/iot-support/Dockerfile
    image: iot-support:latest
    container_name: iot-support
    ports:
      - "8888:8888"   # Forwarder
      - "9999:9999"   # OTA Server
    environment:
      # Forwarder env
      - DB_HOST=postgres_db
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_BROKER_PUB=${MQTT_BROKER_PUB}
      - MQTT_TOPIC_PUB=${MQTT_TOPIC_PUB}
      - MQTT_USERNAME_FOR=${MQTT_USERNAME_FOR}
      - MQTT_PASSWORD_FOR=${MQTT_PASSWORD_FOR}
      - TELE_BOT_ALRT=${TELE_BOT_ALRT}
      # OTA env
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - TELE_BOT_OTA=${TELE_BOT_OTA}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SERVER_NAME=${SERVER_NAME:-ren_itdt_west}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - FORWARDER_URL=http://localhost:8888/forwarder/status
      - FORWARDER_API_URL=http://localhost:8888/api
      - MONITOR_URL=http://localhost:8888/monitor/status
      # Shared
      - TZ=Asia/Jakarta
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    env_file:
      - .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/root:ro
      # File upload OTA disimpan di folder ./upload/
      - ./upload:/app/static/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Production Monitoring Service ===
  production:
    build:
      context: .
      dockerfile: core/production/Dockerfile
    image: iot-production:latest
    container_name: production
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MQTT_HOST=emqx
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

volumes:
  emqx_data:
  emqx_log:

networks:
  iot-net:
    driver: bridge
