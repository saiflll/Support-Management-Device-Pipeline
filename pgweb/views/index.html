<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Database Management - IoT System</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) rotate(0);
            }

            33% {
                transform: translate(30px, -50px) rotate(120deg);
            }

            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        @keyframes morph {

            0%,
            100% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
                transform: translate(0, 0) rotate(0deg);
            }

            25% {
                border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
                transform: translate(10px, -10px) rotate(90deg);
            }

            50% {
                border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%;
                transform: translate(-10px, 10px) rotate(180deg);
            }

            75% {
                border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;
                transform: translate(10px, 5px) rotate(270deg);
            }
        }

        body {
            background: #000;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(168, 85, 247, 0.05) 40%, transparent 70%);
            top: 10%;
            left: 10%;
            animation: float 20s ease-in-out infinite, morph 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }

        body::after {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, rgba(34, 211, 238, 0.05) 40%, transparent 70%);
            bottom: 15%;
            right: 15%;
            animation: float 25s ease-in-out infinite reverse, morph 18s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }

        .morph-blob-1 {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, rgba(239, 68, 68, 0.04) 40%, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: morph 20s ease-in-out infinite, float 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            filter: blur(50px);
        }

        .cyber-card {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px) saturate(180%);
            position: relative;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.2, 1);
        }

        .card-cyan {
            border: 1px solid rgba(34, 211, 238, 0.4);
            box-shadow: 0 4px 30px rgba(34, 211, 238, 0.1);
        }

        .card-cyan:hover {
            border-color: rgba(34, 211, 238, 0.8);
            box-shadow: 0 8px 40px rgba(34, 211, 238, 0.25);
            transform: translateY(-3px);
        }

        .text-glow-cyan {
            color: #22d3ee;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-custom::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #a855f7, #22d3ee);
            border-radius: 3px;
        }

        iframe {
            border: none;
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 600px;
            border-radius: 12px;
        }

        .btn-cyber {
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.2, 1);
        }

        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 211, 238, 0.4);
        }
    </style>
</head>

<body class="text-gray-100 min-h-screen font-sans">
    <div class="morph-blob-1"></div>

    <div class="max-w-7xl mx-auto p-4 sm:p-6 relative z-10">
        <!-- Header -->
        <header class="cyber-card card-cyan rounded-2xl p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="p-3 rounded-xl border border-cyan-500">
                        <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-glow-cyan">Database Management</h1>
                        <p class="text-xs text-gray-400 mt-0.5">PostgreSQL Web Interface • <span
                                class="text-gray-500 text-[10px]">Secure Access</span></p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="window.close()"
                        class="btn-cyber px-4 py-2 rounded-xl font-semibold text-sm border border-gray-600 text-gray-400 hover:bg-gray-700 hover:text-white transition-all duration-300 flex items-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                clip-rule="evenodd"></path>
                        </svg>
                        <span>Close</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Info Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="cyber-card card-cyan rounded-xl p-4 text-center">
                <div class="text-sm text-gray-400 mb-1">Database</div>
                <div class="text-lg font-bold text-cyan-400">servfi</div>
            </div>
            <div class="cyber-card card-cyan rounded-xl p-4 text-center">
                <div class="text-sm text-gray-400 mb-1">Server</div>
                <div class="text-lg font-bold text-cyan-400">PostgreSQL 13</div>
            </div>
            <div class="cyber-card card-cyan rounded-xl p-4 text-center">
                <div class="text-sm text-gray-400 mb-1">Status</div>
                <div class="text-lg font-bold text-green-400">● Connected</div>
            </div>
        </div>

        <!-- Main Database Interface -->
        <div class="cyber-card card-cyan rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-glow-cyan">Database Explorer</h2>
                <div class="flex items-center space-x-2">
                    <button onclick="refreshDB()"
                        class="btn-cyber px-3 py-1.5 rounded-lg text-xs border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline mr-1" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
                                clip-rule="evenodd"></path>
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- pgweb iframe -->
            <div class="bg-black/60 rounded-xl p-2 border border-cyan-400/20">
                <iframe id="pgwebFrame" src="/api/"></iframe>
            </div>

            <div class="mt-4 text-xs text-gray-500 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline mr-1" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                        clip-rule="evenodd"></path>
                </svg>
                Secure connection • Session authenticated
            </div>
        </div>
    </div>

    <script>
        function refreshDB() {
            document.getElementById('pgwebFrame').src = document.getElementById('pgwebFrame').src;
        }

        // Auto-refresh connection status
        setInterval(() => {
            fetch('/health')
                .then(response => {
                    if (!response.ok) {
                        window.location.href = '/';
                    }
                })
                .catch(() => {
                    console.log('Connection check failed');
                });
        }, 30000); // Check every 30 seconds
    </script>
</body>

</html>
