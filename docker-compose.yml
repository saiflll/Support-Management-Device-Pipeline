services:
  # === Database Service ===
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: rennnagge/postgres-db:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - iot-net

  # === MQTT Broker ===
  emqx:
    image: emqx:5.5
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=${MQTT_USERNAME}
      - EMQX_AUTH__USER__1__PASSWORD=${MQTT_PASSWORD}
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Backend Forwarder Service ===
  backend:
    image: rennn/forwarder-app:latest
    container_name: forwarder
    build:
      context: ./core/forward
      dockerfile: Dockerfile
      args:
        GOLANG_VERSION: 1.24-alpine
    # ports:
    #   - "8888:8000"
    environment:
      - DB_HOST=postgres_db
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_BROKER_PUB=${MQTT_BROKER_PUB}
      - MQTT_TOPIC_PUB=${MQTT_TOPIC_PUB}
      - MQTT_USERNAME_FOR=${MQTT_USERNAME_FOR}
      - MQTT_PASSWORD_FOR=${MQTT_PASSWORD_FOR}
      - TELE_BOT_ALRT=${TELE_BOT_ALRT}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Asia/Jakarta
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    env_file:
      - .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/root:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net
      
  # === OTA Update Service ===
  ota:
    image: rennnagge/ota-app:latest
    container_name: ota-app
    build:
      context: .
      dockerfile: core/ota/Dockerfile
    ports:
      - "9999:9999"
    volumes:
      - ota_uploads:/app/static/uploads
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - TELE_BOT_OTA=${TELE_BOT_OTA}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SERVER_NAME=${SERVER_NAME:-ren_itdt_west}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - FORWARDER_URL=http://forwarder:8888/forwarder/status
      - FORWARDER_API_URL=http://forwarder:8888/api
      - MONITOR_URL=http://forwarder:8888/monitor/status
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Production Monitoring Service (MDCW & Scraper) ===
  production:
    image: rennnagge/production-app:latest
    container_name: production-app
    build:
      context: .
      dockerfile: core/production/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MQTT_HOST=emqx
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-}
      - TZ=Asia/Jakarta
      # Cloud MQTT Forwarder
      - CLOUD_MQTT_BROKER_URI=${CLOUD_MQTT_BROKER_URI:-}
      - CLOUD_MQTT_TOPIC_FORMING=${CLOUD_MQTT_TOPIC_FORMING:-prod/mdcw}
      - CLOUD_MQTT_USERNAME=${CLOUD_MQTT_USERNAME:-}
      - CLOUD_MQTT_PASSWORD=${CLOUD_MQTT_PASSWORD:-}
      # External Conveyor DB Credentials for Scraper
      - PROD_DB_HOST=10.201.40.2
      - PROD_DB_PORT=3306
      - PROD_DB_USER=ppa
      - PROD_DB_PASSWORD=PestaPora123
      - PROD_DB_NAME=db_konveyor
      - DEBUG_MODE=1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net


volumes:
  postgres_data:
  emqx_data:
  emqx_log:
  ota_uploads:

networks:
  iot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24