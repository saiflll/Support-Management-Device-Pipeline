services:
  # === Database Service ===
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: rennnagge/postgres-db:latest
    container_name: IOT-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - iot-net

  # === MQTT Broker ===
  emqx:
    image: emqx:5.5
    container_name: IOT-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=${MQTT_USERNAME}
      - EMQX_AUTH__USER__1__PASSWORD=${MQTT_PASSWORD}
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Redis Cache & Pub/Sub ===
  redis:
    image: redis:7-alpine
    container_name: IOT-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Backend Forwarder Service ===
  backend:
    image: rennn/forwarder-app:latest
    container_name: IOT-forwarder
    build:
      context: ./core/forward
      dockerfile: Dockerfile
      args:
        GOLANG_VERSION: 1.24-alpine
    # ports:
    #   - "8888:8000"
    environment:
      - DB_HOST=postgres_db
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - TELE_BOT_ALRT=${TELE_BOT_ALRT}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Asia/Jakarta
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HEADROOM_API_URL=${HEADROOM_API_URL}
      - HEADROOM_API_KEY=${HEADROOM_API_KEY}

    env_file:
      - .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/root:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Binary Bridge Service (HW binary → JSON for backend) ===
  bridge:
    build:
      context: ./core/bridge
      dockerfile: Dockerfile
    image: rennn/bridge-app:latest
    container_name: IOT-bridge
    ports:
      - "8787:8787"
    environment:
      - MQTT_BROKER_URI=tcp://emqx:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net
      
  # === OTA Update Service ===
  ota:
    image: rennnagge/ota-app:latest
    container_name: IOT-ota
    build:
      context: .
      dockerfile: core/ota/Dockerfile
    ports:
      - "9999:9999"
    volumes:
      - ota_uploads:/app/static/uploads
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - TELE_BOT_OTA=${TELE_BOT_OTA}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SERVER_NAME=${SERVER_NAME:-ren_itdt_west}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - FORWARDER_URL=http://forwarder:8888/health
      - MONITOR_URL=http://forwarder:8888/monitor/status
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Production Monitoring Service (MDCW & Scraper) ===
  production:
    image: rennnagge/production-app:latest
    container_name: IOT-production
    build:
      context: .
      dockerfile: core/production/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MQTT_HOST=emqx
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-}
      - TZ=Asia/Jakarta
      # Cloud MQTT Forwarder
      - CLOUD_MQTT_BROKER_URI=${CLOUD_MQTT_BROKER_URI:-}
      - CLOUD_MQTT_TOPIC_FORMING=${CLOUD_MQTT_TOPIC_FORMING:-prod/mdcw}
      - CLOUD_MQTT_USERNAME=${CLOUD_MQTT_USERNAME:-}
      - CLOUD_MQTT_PASSWORD=${CLOUD_MQTT_PASSWORD:-}
      # External Conveyor DB Credentials for Scraper
      - PROD_DB_HOST=10.201.40.2
      - PROD_DB_PORT=3306
      - PROD_DB_USER=ppa
      - PROD_DB_PASSWORD=PestaPora123
      - PROD_DB_NAME=db_konveyor
      - REDIS_URL=redis://redis:6379/0
      - DEBUG_MODE=1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Dev Tools (profile: dev) ===
  console:
    build:
      context: ./core/sandbox
      dockerfile: Dockerfile
    container_name: IOT-console
    profiles: [dev]
    ports:
      - "9998:9998"
    volumes:
      - sandbox_home:/home/dev
      # - .:/workspace:rw
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DEV_PASS=${DEV_PASS:-devpass}
    restart: unless-stopped
    networks:
      - iot-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: IOT-tunnel
    profiles: [dev, ai]
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - iot-net
    restart: unless-stopped

  # === AI Gateway (profile: ai) ===
  router:
    image: decolua/9router:latest
    container_name: IOT-router
    profiles: [ai]
    ports:
      - "9997:20128"
    volumes:
      - router_data:/app/data
    environment:
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-change-me-to-random-64-char-string}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-123456}
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - iot-net


volumes:
  postgres_data:
  emqx_data:
  emqx_log:
  ota_uploads:
  redis_data:
  sandbox_home:
  router_data:

networks:
  iot-net:
    driver: bridge