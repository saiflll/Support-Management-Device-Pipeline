services:
  # === Database Service ===
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === MQTT Broker ===
  emqx:
    image: emqx:5.5
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=servfi_app
      - EMQX_AUTH__USER__1__PASSWORD=S3cr3tP@ssw0rd!
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - iot-net

  # === Backend Forwarder Service ===
  backend:
    image: forwarder-app:latest
    container_name: forwarder
    build:
      context: ./forward
      dockerfile: Dockerfile
      args:
        GOLANG_VERSION: 1.24-alpine
    ports:
      - "8888:8888"
    environment:
      - MQTT_BROKER_URI=tcp://emqx:1883
      - DB_HOST=postgres_db
      - TZ=Asia/Jakarta
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net
      
  # === OTA Update Service ===
  ota:
    image: ota-app:latest
    container_name: ota-app
    build:
      context: ./ota
      dockerfile: Dockerfile
      args:
        GOLANG_VERSION: 1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./ota/static/uploads:/app/static/uploads
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=cntrl
      - MQTT_PASS=
      - TELEGRAM_BOT_TOKEN=8562677403:AAEp3bAEBbpqTIIMoxCA5XlIGUwYD3ZUtoc
      - TELEGRAM_CHAT_ID=7412135090
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - iot-net

  # === Forming/Production Monitoring Service ===
  forming:
    image: forming-app:latest
    container_name: forming-app
    build:
      context: ./forming
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # MQTT Configuration
      - MQTT_HOST=emqx
      - MQTT_PORT=1883
      - MQTT_USER=servfi_app
      - MQTT_PASSWORD=S3cr3tP@ssw0rd!
      # Google Sheets (Optional)
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      - GOOGLE_SHEET_NAME=Production Data
      # Application Configuration
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - iot-net

volumes:
  postgres_data:
  emqx_data:
  emqx_log:

networks:
  iot-net:
    driver: bridge