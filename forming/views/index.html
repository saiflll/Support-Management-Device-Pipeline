<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDCW Production Monitor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/public/css/forming.css">

  <script src="/public/js/htmx.min.js"></script>
  <script src="/public/js/forming.js?v=1.1"></script>
  <script src="/public/js/alpine.min.js" defer></script>
</head>

<body x-data="appData()">
  <nav class="navbar">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="url(#grad1)" stroke-width="2.5">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color: #667eea; stop-opacity: 1" />
            <stop offset="100%" style="stop-color: #764ba2; stop-opacity: 1" />
          </linearGradient>
        </defs>
        <path d="M3 3v18h18" />
        <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" />
      </svg>
      MDCW Production Monitor
    </div>
    <div class="server-time">
      <span class="pulse"
        style="width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block;"></span>
      <span id="time-display">{{.Time}} WIB</span>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Produksi (1 Jam Terakhir)</h2>
        <button class="btn btn-outline" @click="refreshSummary()">Refresh</button>
      </div>
      <div id="summary-container" hx-get="/summary" hx-trigger="load, every 60s" class="stats-grid">
        <div style="color: var(--text-muted); font-size: 0.875rem">Loading summary...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Data Log Produksi</h2>
        <div style="display: flex; gap: 0.5rem">
          <button class="btn btn-success" @click="exportToCSV()">Export CSV</button>
          <button class="btn btn-primary" @click="refreshData()">Refresh</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab" :class="{ 'active': activeTab === 'all' }" @click="activeTab = 'all'; loadData()">Semua
          Data</button>
        <template x-for="prefix in prefixes" :key="prefix">
          <div style="display: flex; align-items: center; gap: 0.25rem;">
            <button class="tab" :class="{ 'active': activeTab === prefix }" @click="activeTab = prefix; loadData()"
              x-text="prefix"></button>
          </div>
        </template>
      </div>

      <div class="controls">
        <input type="search" placeholder="Cari..." x-model="searchQuery" @input.debounce.500ms="filterData()"
          style="flex: 2;">
        <select x-model="statusFilter" @change="loadData()" style="flex: 1;">
          <option value="all">Semua Status</option>
          <option value="ok">OK</option>
          <option value="metal">Metal</option>
          <option value="under">Under</option>
          <option value="over">Over</option>
          <option value="unknown">Unknown</option>
          <option value="mati">Mati</option>
          <option value="idle">Idle</option>
        </select>
        <select x-model="sortBy" @change="loadData()" style="flex: 1;">
          <option value="newest">Terbaru</option>
          <option value="weight_desc">Berat Max</option>
          <option value="weight_asc">Berat Min</option>
        </select>
        <input type="date" x-model="startDate" @change="loadData()" style="flex: 1;">
        <input type="date" x-model="endDate" @change="loadData()" style="flex: 1;">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th width="8%">ID</th>
              <th width="18%">Timestamp</th>
              <th width="12%">Prefix</th>
              <th width="15%">Berat (g)</th>
              <th width="15%">Pack Count</th>
              <th width="15%">Status</th>
            </tr>
          </thead>
          <tbody id="data-tbody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 3rem;">
                <div class="spinner"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>

</html>
