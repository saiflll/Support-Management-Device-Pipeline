events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8788;
        server_name _;

        # Hanya endpoint ini yang boleh diteruskan.
        location = /v1/compress {
            proxy_pass http://127.0.0.1:8787/v1/compress;

            # Dibutuhkan agar pemeriksaan Host dianggap loopback.
            proxy_set_header Host localhost;

            proxy_http_version 1.1;
            proxy_pass_request_body on;

            # Sesuaikan bila payload sangat besar.
            client_max_body_size 50m;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 5s;
        }

        # Jangan izinkan endpoint Headroom lainnya.
        location / {
            return 404;
        }
    }
}
