name: Deploy VS Code Server

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'openvscode-server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local workspace folder
        run: |
          mkdir -p openvscode-server/workspace

      - name: Deploy VS Code Server stack
        run: |
          docker compose -f openvscode-server/docker-compose.yml up -d --remove-orphans

      - name: Verify service status
        run: |
          docker ps -f name=openvscode_
